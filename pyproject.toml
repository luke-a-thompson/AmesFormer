[project]
name = "ames-graphormer"
version = "0.1.0"
description = "AmesFormer graph transformer for mutagenicity prediction"
authors = [{ name = "Luke Thompson" }, { name = "Josiah Evans" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.3.1",
    "torch-geometric==2.5.3",
    # The original PyTorch/RDKit wheels use the NumPy 1.x ABI.
    "numpy>=1.26.4,<2",
    "click>=8.1.7,<8.2",
    "scikit-learn>=1.4.2,<1.6",
    "scipy>=1.13,<1.15",
    "tqdm>=4.66.4,<5",
    "pandas>=2.2.2,<3",
    "matplotlib>=3.8,<4",
    "rich>=13.7.1,<14",
    "torchinfo>=1.8.0,<2",
    "tensorboardX>=2.6.2.2,<3",
    "tensorboard>=2.16.2,<3",
    "openpyxl>=3.1.2,<4",
    "rdkit==2023.9.6",
    "optuna>=3.6.1,<4",
    "scikit-posthocs>=0.9.0,<0.10",
    # scikit-posthocs 0.9 imports the legacy statsmodels multicomp API.
    "statsmodels>=0.14,<0.15",
    "ogb>=1.3.6,<2",
]

[project.scripts]
train = "graphormer.cli:train"
inference = "graphormer.cli:inference"
tune = "graphormer.cli:tune"
tune_temperature = "graphormer.cli:tune_temperature"

[project.optional-dependencies]
cpu = ["torch==2.3.1"]
cuda = ["torch==2.3.1; sys_platform != 'darwin'"]
rust = ["gnn-tools"]
notebook = ["ipykernel>=6.29.4,<7", "optuna-dashboard>=0.16.1,<0.17"]

[dependency-groups]
dev = ["pytest>=8.2,<9"]

[tool.uv]
# The CPU mirror also hosts older copies of ordinary PyPI packages.
# Compare versions across both indexes so these do not force downgrades.
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
gnn-tools = { path = "gnn-tools" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu121", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

# Also serves torch when no accelerator extra is selected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "gnn-tools/test"]

[tool.hatch.build.targets.wheel]
packages = ["graphormer"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 120

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
